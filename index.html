<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickroll Activity</title>
    <!-- Include the official Discord Embedded App SDK -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Embedded YouTube Player playing the specific video provided -->
    <iframe 
        src="https://youtube.com" 
        allow="autoplay; encrypted-media; picture-in-picture" 
        allowfullscreen>
    </iframe>

    <script>
        // Instantiate the Discord SDK
        const discordSdk = new Discord.DiscordSDK(window.location.search);

        async function setupDiscordSDK() {
            try {
                await discordSdk.ready();
                console.log("Discord SDK is ready and authenticated inside the Activity layout!");
            } catch (error) {
                console.error("Failed to initialize Discord SDK:", error);
            }
        }

        setupDiscordSDK();
    </script>
</body>
</html>
